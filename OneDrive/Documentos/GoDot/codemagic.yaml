workflows:
  ios-export:
    name: iOS Export
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        GODOT_VERSION: "4.3"
      xcode: latest
    scripts:
      - name: Install Godot Engine
        script: |
          brew install godot --cask || true
          GODOT_BIN="/Applications/Godot.app/Contents/MacOS/Godot"
          if [ ! -f "$GODOT_BIN" ]; then
            GODOT_BIN=$(find /Applications -name "Godot" -type f | head -1)
          fi
          echo "Godot bin: $GODOT_BIN"
          $GODOT_BIN --version

      - name: Install Godot Export Templates
        script: |
          set -e
          VERSION="4.3.stable"
          TEMPLATE_DIR="/Users/builder/Library/Application Support/Godot/export_templates/${VERSION}"
          mkdir -p "$TEMPLATE_DIR"
          echo "Baixando templates para $VERSION..."
          curl -L -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -o /tmp/templates.tpz -d /tmp/
          mv /tmp/templates/* "$TEMPLATE_DIR"/ || true
          ls -lh "$TEMPLATE_DIR"
          echo "Templates instalados"

      - name: Export Godot Project to Xcode
        script: |
          set -e
          GODOT_BIN="/Applications/Godot.app/Contents/MacOS/Godot"
          if [ ! -f "$GODOT_BIN" ]; then
            GODOT_BIN=$(find /Applications -name "Godot" -type f | head -1)
          fi
          # reimport e export
          $GODOT_BIN --headless --path . --import
          $GODOT_BIN --headless --path . --export-release "iOS" ./build/ios/ThereChocolates.xcodeproj || \
          $GODOT_BIN --headless --path . --export-release "iOS" ./ios_build/ || \
          $GODOT_BIN --headless --path . --export-debug "iOS" ./build/ios/

      - name: Diagnostic - lista o que o Godot realmente gerou
        script: |
          ls -R
          ls -R ./build || true

    artifacts:
      - build/**
      - ios_build/**
      - build/ios/**