workflows:
  ios-export:
    name: iOS Export
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        GODOT_VERSION: "4.3"
      xcode: latest
    scripts:
      - name: Install Godot Engine
        script: |
          brew install godot --cask || true
          GODOT_BIN="/Applications/Godot.app/Contents/MacOS/Godot"
          if [ ! -f "$GODOT_BIN" ]; then
            GODOT_BIN=$(find /Applications -name "Godot" -type f | head -1)
          fi
          echo "Godot bin: $GODOT_BIN"
          $GODOT_BIN --version

      - name: Install Godot Export Templates
        script: |
          set -e
          # Baixa uma vez
          curl -L -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -o /tmp/templates.tpz -d /tmp/
          # Instala para TODAS as versões que o Godot pode procurar
          for VER in "4.3.stable" "4.7.1.stable" "4.4.stable" "4.3"; do
            TEMPLATE_DIR="/Users/builder/Library/Application Support/Godot/export_templates/${VER}"
            mkdir -p "$TEMPLATE_DIR"
            cp -R /tmp/templates/* "$TEMPLATE_DIR"/ || true
            echo "Instalado em $TEMPLATE_DIR"
            ls "$TEMPLATE_DIR" | head -20
          done

      - name: Export Godot Project to Xcode
        script: |
          set -e
          GODOT_BIN="/Applications/Godot.app/Contents/MacOS/Godot"
          if [ ! -f "$GODOT_BIN" ]; then
            GODOT_BIN=$(find /Applications -name "Godot" -type f | head -1)
          fi
          $GODOT_BIN --headless --path . --import
          $GODOT_BIN --headless --path . --export-release "iOS" ./build/ios/ || \
          $GODOT_BIN --headless --path . --export-debug "iOS" ./build/ios/

      - name: Diagnostic
        script: |
          ls -R ./build || true
          ls -R "/Users/builder/Library/Application Support/Godot/export_templates" || true

    artifacts:
      - build/**