workflows:
  ios-export:
    name: iOS Export
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Install Godot 4.3 + Templates
        script: |
          set -e
          cd /tmp
          curl -L -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_macos.universal.zip
          unzip -o godot.zip
          rm -rf /Applications/Godot.app
          mv Godot.app /Applications/Godot.app
          chmod +x /Applications/Godot.app/Contents/MacOS/Godot
          /Applications/Godot.app/Contents/MacOS/Godot --version
          VER="4.3.stable"
          DIR="/Users/builder/Library/Application Support/Godot/export_templates/${VER}"
          mkdir -p "$DIR"
          curl -L -o /tmp/t.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -o /tmp/t.tpz -d /tmp/
          cp -R /tmp/templates/* "$DIR"/
          mkdir -p "/Users/builder/Library/Application Support/Godot/export_templates/4.7.1.stable"
          cp -R /tmp/templates/* "/Users/builder/Library/Application Support/Godot/export_templates/4.7.1.stable"/
      - name: Fix Project + Export
        script: |
          set -e
          set -o pipefail
          rm -rf ./build/ios
          mkdir -p ./build
          printf '[preset.0]\nname="iOS"\nplatform="iOS"\nrunnable=true\ndedicated_server=false\ncustom_features=""\nexport_filter="all_resources"\ninclude_filter=""\nexclude_filter=""\nexport_path="build/ios"\nencryption_include_filters=""\nencryption_exclude_filters=""\nencrypt_pck=false\nencrypt_directory=false\n[preset.0.options]\ncustom_template/debug=""\ncustom_template/release=""\napplication/app_store_team_id="HW38KGP44Z"\napplication/bundle_identifier="br.com.therechocolates.chocolataria"\napplication/signature=""\napplication/short_version="1.0"\napplication/version="1"\napplication/icon_interpolation=4\napplication/export_project_only=true\napplication/min_version="12.0"\ncapabilities/access_wifi=false\ncapabilities/game_center=false\ncapabilities/push_notifications=false\ncapabilities/in_app_purchases=false\n' > export_presets.cfg
          cat export_presets.cfg
          /Applications/Godot.app/Contents/MacOS/Godot --headless --path . --import
          /Applications/Godot.app/Contents/MacOS/Godot --headless --path . --export-release "iOS" ./build/ios --verbose 2>&1 | tee /tmp/full.log
          echo "=== SUCCESS ==="
          ls -R ./build
          find ./build -type f | head -n 100
    artifacts:
      - build/**
      - /tmp/full.log