workflows:
  ios-export:
    name: iOS Export
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      vars:
        XCODE_WORKSPACE: ""
        XCODE_SCHEME: ""
    scripts:
      - name: Fix UIDs + Export
        script: |
          #!/usr/bin/env bash
          set -e
          echo "Godot version:"
          /Applications/Godot.app/Contents/MacOS/Godot --version
          echo "Cleaning invalid UIDs"
          find . -name "*.tscn" -exec sed -i '' 's/ uid="uid:\/\/[^"]*"//g' {} \; 2>/dev/null || find . -name "*.tscn" -exec sed -i 's/ uid="uid:\/\/[^"]*"//g' {} \;
          rm -rf ./build
          mkdir -p ./build/ios
          echo "Import:"
          /Applications/Godot.app/Contents/MacOS/Godot --headless --path . --import 2>&1
          echo "Export:"
          /Applications/Godot.app/Contents/MacOS/Godot --headless --path . --export-release "iOS" ./build/ios --verbose 2>&1 | tee /tmp/full.log
          echo "Result:"
          ls -R ./build