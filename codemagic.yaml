 - name: Fix Project + Export
        script: |
          set -e
          echo "=== CLEAN ==="
          rm -rf ./build/ios
          mkdir -p ./build
          
          echo "=== PATCH EXPORT MINIMAL ==="
          cat > export_presets.cfg << 'EOF'
          [preset.0]
          name="iOS"
          platform="iOS"
          runnable=true
          export_filter="all_resources"
          export_path="build/ios"
          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          application/app_store_team_id="HW38KGP44Z"
          application/bundle_identifier="br.com.therechocolates.chocolataria"
          application/signature=""
          application/short_version="1.0"
          application/version="1"
          application/icon_interpolation=4
          application/export_project_only=true
          capabilities/access_wifi=false
          capabilities/game_center=false
          capabilities/push_notifications=false
          capabilities/in_app_purchases=false
          EOF
          cat export_presets.cfg
          
          echo "=== IMPORT ==="
          /Applications/Godot.app/Contents/MacOS/Godot --headless --path . --import 2>&1 | tail -n 20
          
          echo "=== EXPORT ==="
          /Applications/Godot.app/Contents/MacOS/Godot --headless --path . --export-release "iOS" ./build/ios --verbose 2>&1 | tee /tmp/full.log
          cat /tmp/full.log
          echo "=== RESULT ==="
          ls -R ./build
          find ./build -type f | head -n 30