workflows:
  ios-export:
    name: iOS Export
    instance_type: mac_mini_m2
    max_build_duration: 30
    scripts:
      - name: Fix UIDs + Export
        script: |
          #!/usr/bin/env bash
          set -e
          /Applications/Godot.app/Contents/MacOS/Godot --version
          find . -name "*.tscn" -type f -exec sed -i '' 's/ uid="uid:\/\/[^"]*"//g' {} \; || true
          rm -rf ./build/ios
          mkdir -p ./build/ios
          /Applications/Godot.app/Contents/MacOS/Godot --headless --path . --import
          /Applications/Godot.app/Contents/MacOS/Godot --headless --path . --export-release "iOS" ./build/ios --verbose
          ls -R ./build/ios