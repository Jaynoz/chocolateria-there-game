workflows:
  ios-export:
    name: iOS Export
    instance_type: mac_mini_m2
    max_build_duration: 30
    scripts:
      - name: Install Godot + Templates + Export
        script: |
          #!/usr/bin/env bash
          set -e
          echo "Downloading Godot 4.3..."
          curl -L -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_macos.universal.zip
          unzip -q godot.zip
          GODOT_BIN="$PWD/Godot.app/Contents/MacOS/Godot"
          chmod +x "$GODOT_BIN"

          echo "Downloading export templates..."
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.3.stable
          curl -L -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q templates.tpz
          mv templates/* ~/Library/Application\ Support/Godot/export_templates/4.3.stable/
          
          "$GODOT_BIN" --version
          rm -rf ./build/ios
          mkdir -p ./build/ios
          "$GODOT_BIN" --headless --path . --import
          "$GODOT_BIN" --headless --path . --export-release "iOS" ./build/ios --verbose
          ls -R ./build/ios